  <!-- 固定ボタン（約300pxスクロールで表示） -->
  <div class="fab" id="fab" hidden>

    </button>

  <!-- 検索パネル（タブ：タグ／月別／カテゴリー／キーワード） -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="search-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>

    <div class="sheet-head">

      <button type="button" role="tab" id="tab-keyword" aria-controls="tabpanel-keyword" data-tab="keyword">キーワード</button>

      <div role="tabpanel" id="tabpanel-keyword" aria-labelledby="tab-keyword" data-panel="keyword" hidden>

          <label for="search-input" class="visually-hidden">キーワード</label>
          <input type="search" id="search-input" name="q" placeholder="キーワード（スペースで AND）" autocomplete="off" enterkeyhint="search">

        <p class="hint">タイトル・要約・タグ・カテゴリー・本文から探します。全角/半角・大文字/小文字・ひらがな/カタカナは区別しません。</p>
